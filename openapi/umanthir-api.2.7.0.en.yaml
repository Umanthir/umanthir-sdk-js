          items:
            $ref: '#/components/schemas/WikiNamedValue'
        classification: {type: integer, nullable: true}
        max_tier: {type: integer, nullable: true}
        imbuement_slots: {type: integer, nullable: true}
        perks: {type: array, items: {type: string}}
        dropped_by: {type: array, items: {type: string}}
        value: {type: string, nullable: true}
        npc_price: {type: integer, nullable: true, format: int64}
        buy_from: {type: string, nullable: true}
        sell_to: {type: string, nullable: true}
