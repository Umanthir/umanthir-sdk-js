              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikiItemList'
              example:
                category: {slug: axes, name: Axes, group: weapons}
                count: 1
                items:
                  - name: Hellforged Axe
                    type: Machados
                    level_required: 110
                    attack: 51
                    defense: 28
                    weight: 88
                    image_url: 'https://www.tibiawiki.com.br/images/1/1e/Hellforged_Axe.gif'
