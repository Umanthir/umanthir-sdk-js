                        begins_on: '2027-02-21'
                        worlds_successful:
                          - {rank: 1, date: '2026-02-22', worlds: [Calmera, Dia, Harmonia]}
                          - {rank: 10, date: '2026-02-23', worlds: [Aethera, Antica]}
