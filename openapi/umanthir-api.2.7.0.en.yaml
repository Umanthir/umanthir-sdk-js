        logo: {type: string}
        description: {type: string, description: "Free text of the guild, before the founding sentence."}
        homepage: {type: string, description: "Text of the sentence \"The official homepage is at ...\", written by the guild. Not validated: treat it as text, not as a trusted link."}
        founded: {type: string, format: date}
        status: {type: string, enum: [active, in_formation]}
        status_text: {type: string, description: "Status sentence as the page writes it, including the leadership warning."}
        applications_open: {type: boolean}
