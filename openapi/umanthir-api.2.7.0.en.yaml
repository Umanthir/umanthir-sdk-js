            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  parameters:
    HouseSlug:
      name: slug
      in: path
      required: true
      description: "House slug from the list: lower-case ASCII with hyphens. Another format is 400 `Invalid house.`."
      schema: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 120, example: admiral-s-avenue-1}
    WikiCategory:
      name: category
      in: path
      required: true
      description: "Category slug, as listed by `/v2/wiki/categories`. An unknown slug is 404."
      schema: {type: string, example: axes}
    CharacterName:
      name: name
      in: path
      required: true
      description: Character name. NBSP becomes a space. `/`, `\`, `?`, `#` and `&` respond 400.
      schema:
        type: string
        example: Njorn
    World:
      name: world
      in: query
      description: World name. Empty for the list. The first letter is capitalised in the highscores URL.
      schema:
        type: string
        example: Antica
    WorldPath:
      name: world
      in: path
      required: true
      schema:
        type: string
        example: Antica
    Page:
      name: page
      in: query
      description: Page starting at 1. Missing means 1. Non-numeric or less than 1 responds 400.
      schema:
        type: integer
        minimum: 1
        default: 1
    PagePath:
      name: page
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    HighscoreCategory:
      name: category
      in: query
      schema:
        $ref: '#/components/schemas/HighscoreCategory'
    Vocation:
      name: vocation
      in: query
      schema:
        $ref: '#/components/schemas/VocationFilter'
    Protection:
      name: protection
      in: query
      schema:
        $ref: '#/components/schemas/Protection'
    WorldTypes:
      name: types
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/WorldType'
    WorldTypesBracket:
      name: types[]
      in: query
      description: The same as `types`, in the format the old collection sends.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/WorldType'
    GuildName:
      name: name
      in: path
      required: true
      description: "Guild name, case-insensitive. `/`, `\\`, `?`, `#`, `&` and `%` respond 400."
      schema:
        type: string
        example: Alanui Institute
    HouseTown:
      name: town
      in: path
      required: true
      description: 'Town, such as Thais or Liberty Bay. Case-insensitive for the known towns. `/`, `\`, `?`, `#`, `&` and `%` respond 400.'
      schema:
        type: string
        example: Thais
    HouseID:
      name: house_id
      in: path
      required: true
      description: "House id, as in the list. Digits only, no leading zero; anything else responds 400 `Invalid house id.`."
      schema:
        type: integer
        minimum: 1
        example: 10301
    HouseState:
      name: state
      in: query
      description: Only auctioned or only rented houses. Empty brings all. Any other value responds 400 `Unknown state.`.
      schema:
        type: string
        enum: [auctioned, rented]
    HouseType:
      name: type
      in: query
      description: Houses and flats, or guildhalls. Any other value responds 400 `Unknown type.`.
      schema:
        type: string
        enum: [houses, guildhalls]
        default: houses
    HouseOrder:
      name: order
      in: query
      description: Page order. Any other value responds 400 `Unknown order.`.
      schema:
        type: string
        enum: [name, size, rent, bid, end]
        default: name
    DocsLanguage:
      name: lang
      in: path
      required: true
      description: Documentation language. Case-sensitive. Any other value responds 404.
      schema:
        type: string
        enum: [en, pt-BR]
  headers:
    XApiVersion:
      description: API version.
      schema: {type: string, example: 2.7.0}
    CacheControl:
      schema: {type: string, example: 'public, max-age=60'}
    ETag:
      schema: {type: string}
    XUmanthirDataAge:
      description: "Seconds since the profile behind this answer was read from tibia.com. Profiles are cached: fresh for 5 minutes, then served stale while one refresh runs in the background."
      schema: {type: integer, example: 42}
    XUmanthirDataState:
      description: "`fresh` (younger than 5 minutes) or `stale` (older; a refresh is already running, or tibia.com could not be read)."
      schema: {type: string, enum: [fresh, stale], example: fresh}
    Deprecation:
      description: "The 520 answer of this route is deprecated since this date (RFC 9745). Only on that 520, and only while a sunset date is set."
      schema: {type: string, example: '@1777939200'}
    Sunset:
      description: "From this date the 520 answer of this route becomes 503 with Retry-After (RFC 8594)."
      schema: {type: string, example: 'Tue, 02 Feb 2027 00:00:00 GMT'}
    DeprecationLink:
      description: "Where the deprecation is documented."
      schema: {type: string, example: '<https://api.umanthir.com/v2/docs>; rel="deprecation"; type="text/html"'}
    RateLimitLimit:
      schema: {type: integer}
    RateLimitRemaining:
      schema: {type: integer}
    RateLimitReset:
      description: Unix time at which the window resets.
      schema: {type: integer}
  responses:
    BadRequest:
      description: |
        Invalid query or name. Messages used: `Invalid page.`, `Invalid name.`,
        `Unknown category.`, `Unknown vocation.`, `Unknown protection.`, `Unknown world type.`,
        `Invalid worlds.`, `Too many worlds.`, `Unknown fields.`, `Invalid grade.`,
        `Unknown state.`, `Unknown type.`, `Unknown order.`, `Invalid house id.`, `Invalid level.`, `Invalid loyalty.`, `Unknown skill.`, `Invalid skill.`, `Invalid charges.`, `Invalid experience.`, `Invalid target level.`, `Pass level or experience.`, `Invalid hunt.`, `Duplicate member.`
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 400, message: Unknown vocation.}
    TooManyRequests:
      description: Rate limit of the current window.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        RateLimit-Limit:
          schema: {type: integer}
        RateLimit-Remaining:
          schema: {type: integer, example: 0}
        RateLimit-Reset:
          schema: {type: integer}
        Retry-After:
          schema: {type: integer, description: Seconds until a new attempt is allowed.}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 429, message: Rate limit exceeded.}
    BadGateway:
      description: Internal error that did not come with its own status. The body carries no HTML.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 502, message: Upstream request failed.}
    UpstreamFailed:
      description: |
        Failure fetching or reading tibia.com. The response is closed. Generic message
        `Upstream request failed.` An empty highscore can also respond 520 with
        `Error when getting Hightscore ranks category: (...)`.
        When the API itself holds the read back (read ceiling, or a pause after a Cloudflare
        challenge, 429, 403 or 503 from tibia.com), the answer carries `Retry-After` and
        `Cache-Control: no-store`.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Retry-After:
          schema: {type: integer, example: 60}
          description: Seconds until the API reads tibia.com again. Only when the read was held back.
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 520, message: Upstream request failed.}
    CharacterUpstreamFailed:
      description: |
        No profile to serve: tibia.com could not be read and there is no cached copy young enough
        (up to 24 hours). The message is `Upstream request failed.` `Retry-After` says when the API
        reads tibia.com again, with `Cache-Control: no-store`.
        Deprecated: this 520 becomes **503 with `Retry-After`** at the `Sunset` date. While a date is
        set, the answer carries `Deprecation`, `Sunset` and `Link` headers.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Retry-After:
          schema: {type: integer, example: 60}
          description: "Seconds until the API reads tibia.com again."
        Deprecation:
          $ref: '#/components/headers/Deprecation'
        Sunset:
          $ref: '#/components/headers/Sunset'
        Link:
          $ref: '#/components/headers/DeprecationLink'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 520, message: Upstream request failed.}
    UpstreamBusy:
      description: |
        Every requested world was held back by the protection against blocking by tibia.com
        (read ceiling or pause after 403/429/503). Try again after `Retry-After`. It also answers 503 `Tibia.com is under maintenance.` when every requested world fell into the tibia.com maintenance.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Cache-Control:
          schema: {type: string, example: no-store}
        Retry-After:
          schema: {type: integer, description: Seconds until a new attempt is allowed.}
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 503, message: Upstream busy.}
    GuildsNotFound:
      description: "World tibia.com does not know (the selector does not show the requested world), unknown guild, or page out of the expected format."
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 404, message: Guilds data not found!}
    HousesNotFound:
      description: World or town tibia.com does not know (the search caption does not match), unknown house, or page out of the expected format.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 404, message: Houses data not found!}
    WikiNotFound:
      description: "Unknown category, or no active item with this name in the category."
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 404, message: Not found.}
    HouseNotFound:
      description: "Unknown house (`House not found.`) or floor (`Floor not found.`)."
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 404, message: House not found.}
    HouseGone:
      description: "The house left the Tibia client: `reason` is `removed`, or `renamed` with the new slug in `replaced_by`."
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HouseGone'
          example:
            error: {status_code: 410, message: House renamed.}
            reason: renamed
            replaced_by: thais-clanhall
    HousesUnavailable:
      description: |
        The houses bucket is not configured or does not answer and there is no recent index, or a file
        does not match the index (a publication in progress). `Retry-After` suggests when to try again.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Retry-After:
          schema: {type: integer, example: 60}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 503, message: Houses data unavailable.}
    WikiUnavailable:
      description: |
        The leech database is not configured or does not answer, and there is no recent copy
        to serve. `Retry-After` suggests when to try again.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Retry-After:
          schema: {type: integer, example: 60}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 503, message: Wiki data unavailable.}
    NotFound:
      description: Route does not exist.
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        ETag:
          $ref: '#/components/headers/ETag'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 404, message: Not found.}
    Maintenance:
      description: "Tibia.com in maintenance (redirected to maintenance.tibia.com). The API does not call tibia.com for 5 minutes from the detection; Retry-After tells when to try again."
      headers:
        X-API-Version:
          $ref: '#/components/headers/XApiVersion'
        Retry-After:
          schema: {type: integer, description: "Seconds until the next probe."}
        Cache-Control:
          schema: {type: string, example: no-store}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: {status_code: 503, message: 'Tibia.com is under maintenance.'}
    NotModified:
      description: The `If-None-Match` matches the ETag. No body.
      headers:
        ETag:
          schema: {type: string}
  securitySchemes:
    PortalToken:
      type: http
      scheme: bearer
      description: Optional token from the Umanthir portal (umt_live_<id>_<secret>).
  schemas:
    OnlineBatch:
      type: object
      required: [fetched_at, worlds, unknown, failed]
      properties:
        fetched_at: {type: string, format: date-time, description: UTC instant at which the response was built. Left out of the ETag.}
        worlds:
          type: array
          description: In request order, without duplicates.
          items: {$ref: '#/components/schemas/WorldOnline'}
        unknown:
          type: array
          items: {type: string}
          description: Requested worlds that do not exist, as they were sent.
        failed:
          type: array
          items: {$ref: '#/components/schemas/WorldFailure'}
    WorldOnline:
      type: object
      required: [name, players_online, updated_at, stale, online]
      properties:
        name: {type: string, description: Canonical world name.}
        players_online: {type: integer, description: Size of `online`.}
        updated_at: {type: string, format: date-time, description: "Read of the list on tibia.com, in UTC. Left out of the ETag."}
        stale: {type: boolean, description: True when the new read failed and the last good list was returned (up to 5 min).}
        online:
          type: array
          description: Alphabetical order, case-insensitive. NBSP becomes a space. With `fields=names`, names only.
          items:
            oneOf:
              - {type: string}
              - {$ref: '#/components/schemas/OnlinePlayer'}
    WorldFailure:
      type: object
      required: [name, status_code, message]
      description: World with no list at all to return. 520 `Upstream request failed.` when tibia.com failed; 503 `Upstream busy.` when the protection held the read back.
      properties:
        name: {type: string}
        status_code: {type: integer, enum: [503, 520]}
        message: {type: string}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status_code, message]
          properties:
            status_code: {type: integer}
            message: {type: string}
            code: {type: string, description: Stable machine code; only on some errors (origin_not_allowed).}
    Share:
      type: object
      required: [min, max]
      properties:
        min: {type: integer}
        max: {type: integer}
    Title:
      type: object
      required: [title, unlockeds]
      properties:
        title: {type: string}
        unlockeds: {type: integer}
    Guild:
      type: object
      required: [name]
      properties:
        name: {type: string}
        rank: {type: string}
    House:
      type: object
      required: [house]
      properties:
        house: {type: string, description: "Name and town, such as `Targuna Cottage  1 (Thais)`."}
        paid_until: {type: string, format: date, description: Date YYYY-MM-DD.}
    CharacterInfo:
      type: object
      required: [name, level, share_experience]
      properties:
        name: {type: string}
        former_names: {type: array, items: {type: string}}
        former_worlds: {type: array, items: {type: string}}
        level: {type: integer}
        share_experience:
          $ref: '#/components/schemas/Share'
        title:
          $ref: '#/components/schemas/Title'
        sex: {type: string}
        vocation: {type: string}
        achievement_points: {type: integer}
        world: {type: string}
        residence: {type: string}
        married: {type: string}
        houses: {type: array, items: {$ref: '#/components/schemas/House'}}
        guild:
          $ref: '#/components/schemas/Guild'
        last_login: {type: string, format: date-time}
        comment: {type: string}
        account_status: {type: string}
    Achievement:
      type: object
      required: [name, secret, grade]
      properties:
        name: {type: string}
        secret:
          type: boolean
          description: True when the name is missing, is ????, or the secret achievement image is on the row.
        grade: {type: integer}
    Badge:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        icon: {type: string, description: Image URL on the page. The API does not download the file.}
    Account:
      type: object
      properties:
        loyalty_title: {type: string}
        created: {type: string, format: date-time}
    Alt:
      type: object
      required: [index, name, main]
      properties:
        index: {type: integer}
        name: {type: string}
        world: {type: string}
        status: {type: string}
        main: {type: boolean}
    Killer:
      type: object
      required: [name, player, traded]
      properties:
        name: {type: string}
        player: {type: boolean}
        traded: {type: boolean}
    Death:
      type: object
      required: [time, level, reason, killers]
      properties:
        time: {type: string, format: date-time}
        level: {type: integer}
        reason: {type: string}
        killers: {type: array, items: {$ref: '#/components/schemas/Killer'}}
    Character:
      type: object
      required: [character_information, deaths]
      properties:
        character_information:
          $ref: '#/components/schemas/CharacterInfo'
        account_badges: {type: array, items: {$ref: '#/components/schemas/Badge'}}
        account_achievements: {type: array, items: {$ref: '#/components/schemas/Achievement'}}
        account_information:
          $ref: '#/components/schemas/Account'
        deaths: {type: array, items: {$ref: '#/components/schemas/Death'}}
        characters: {type: array, items: {$ref: '#/components/schemas/Alt'}}
    Rank:
      type: object
      required: [rank, name, level, value]
      properties:
        rank: {type: integer}
        name: {type: string}
        title: {type: string}
        vocation: {type: string}
        world: {type: string}
        level: {type: integer}
        value: {type: integer}
    Highscores:
      type: object
      required: [page, last_update, category, rank_list_size, rank_list]
      properties:
        page: {type: integer}
        last_update: {type: string, format: date-time}
        category: {type: string}
        rank_list_size: {type: integer}
        world: {type: string}
        rank_list: {type: array, items: {$ref: '#/components/schemas/Rank'}}
    HighscorePage:
      type: object
      required: [highscores]
      properties:
        highscores:
          $ref: '#/components/schemas/Highscores'
    RankHit:
      type: object
      required: [rank, level, value]
      properties:
        rank: {type: integer}
        level: {type: integer}
        value: {type: integer}
    HighscoreCategory:
      type: string
      default: experience
      enum:
        - achievements
        - axefighting
        - charmpoints
        - clubfighting
        - distancefighting
        - experience
        - fishing
        - fistfighting
        - goshnarstaint
        - loyaltypoints
        - magiclevel
        - shielding
        - swordfighting
        - dromescore
        - bosspoints
        - bountypointsearned
        - weeklytaskscompleted
        - phosphorusrecord
    VocationFilter:
      type: string
      default: all
      enum: [all, none, knights, paladins, sorcerers, druids, monks]
    Protection:
      type: string
      default: any
      enum: [any, unprotected, protected, initially_protected]
    WorldType:
      type: string
      enum: [open_pvp, optional_pvp, hardcore_pvp, retro_open_pvp, retro_hardcore_pvp]
    WorldRecord:
      type: object
      required: [value]
      properties:
        value: {type: integer}
        date: {type: string, format: date-time}
    WorldSummary:
      type: object
      required: [name, players_online, location, type, battleye, info]
      properties:
        name: {type: string}
        players_online: {type: integer}
        location: {type: string}
        type: {type: string}
        battleye: {type: string, description: Green when the image is the initial one; otherwise Yellow.}
        info:
          type: array
          items: {type: string}
          description: Additional Information split by commas. Empty when the cell has no text.
    WorldList:
      type: object
      required: [players_online, worlds_count, record_players, regular_worlds]
      properties:
        players_online: {type: integer}
        worlds_count: {type: integer}
        record_players:
          $ref: '#/components/schemas/WorldRecord'
        regular_worlds: {type: array, items: {$ref: '#/components/schemas/WorldSummary'}}
    OnlinePlayer:
      type: object
      required: [name, level, share_experience, vocation]
      properties:
        name: {type: string}
        level: {type: integer}
        share_experience:
          $ref: '#/components/schemas/Share'
        vocation: {type: string}
    WorldDetail:
      type: object
      required: [name, players_online, online_players]
      properties:
        name: {type: string}
        status: {type: string}
        players_online: {type: integer}
        world_record:
          type: object
          required: [record_players]
          description: Peak of online players in this world.
          properties:
            record_players: {type: integer}
            on_date:
              type: string
              format: date-time
              description: UTC instant of the peak. The page's time is read in Europe/Berlin.
        creation_date: {type: string}
        location: {type: string}
        pvp_type: {type: string}
        world_quest_titles:
          type: array
          items: {type: string}
          description: Titles split by commas. Empty when the cell has no text.
        battleye_status:
          type: object
          required: [protected]
          properties:
            protected: {type: boolean}
            since:
              type: string
              format: date
              description: Day written in the sentence, YYYY-MM-DD. Missing when the sentence has no date.
        game_world_type: {type: string}
        premium_type: {type: string}
        transfer_type: {type: string}
        online_players: {type: array, items: {$ref: '#/components/schemas/OnlinePlayer'}}
    RotationNow:
      type: object
      required: [ends_on, ends_in, rotation]
      properties:
        ends_on:
          type: string
          format: date-time
          description: 10:00 from the page text, in Europe/Berlin, converted to UTC.
        ends_in:
          type: object
          required: [days, hours, minutes]
          description: Time left until ends_on. Seconds are dropped. A past deadline stays at zero.
          properties:
            days: {type: integer}
            hours: {type: integer}
            minutes: {type: integer}
        rotation: {type: integer}
    RotationPast:
      type: object
      required: [closed_on, rotation]
      properties:
        closed_on: {type: string, format: date-time}
        rotation: {type: integer}
    Rotations:
      type: object
      required: [current, past]
      properties:
        current:
          $ref: '#/components/schemas/RotationNow'
        past:
          $ref: '#/components/schemas/RotationPast'
    DromeRow:
      type: object
      required: [rank, name, drome_level]
      properties:
        rank: {type: integer}
        name: {type: string}
        drome_level: {type: integer}
    DromeRank:
      type: object
      required: [world, rotation, page, last_update, rotations, rank]
      properties:
        world: {type: string}
        rotation: {type: integer}
        page: {type: integer}
        last_update: {type: string, format: date-time}
        rotations: {type: array, items: {type: integer}}
        rank: {type: array, items: {$ref: '#/components/schemas/DromeRow'}}
    PointRange:
      type: object
      required: [min, max]
      description: Points range of the grade, read from the page legend.
      properties:
        min: {type: integer}
        max: {type: integer}
    LibraryAchievement:
      type: object
      required: [name, grade, points, description]
      properties:
        name: {type: string}
        grade: {type: integer, minimum: 1, maximum: 4}
        points:
          $ref: '#/components/schemas/PointRange'
        description: {type: string, description: "Text from the page, with whitespace normalised."}
    AchievementList:
      type: object
      required: [count, secret_count, achievements]
      properties:
        count:
          type: integer
          description: Number of items in achievements, after the filter.
        secret_count:
          type: integer
          description: Secret achievements announced by the page. Does not change with the filter.
        achievements: {type: array, items: {$ref: '#/components/schemas/LibraryAchievement'}}
    Boss:
      type: object
      required: [name, image, boosted]
      properties:
        name: {type: string}
        image: {type: string}
        boosted: {type: boolean}
    Bosses:
      type: object
      required: [boosted, boostable_count, updated_at, stale, boostable_bosses]
      properties:
        boosted:
          $ref: '#/components/schemas/Boss'
        boostable_count: {type: integer}
        updated_at: {type: string, format: date-time, description: "UTC instant at which the page was read from tibia.com."}
        stale: {type: boolean, description: "True when the cache serves the page past its scheduled refresh, because the read failed (tibia.com maintenance, for one). updated_at shows its age."}
        boostable_bosses: {type: array, items: {$ref: '#/components/schemas/Boss'}}
    Creature:
      type: object
      required: [name, race, image]
      properties:
        name: {type: string}
        race: {type: string}
        image: {type: string}
        summary:
          type: string
          description: Story from a race's page, without the status paragraphs. Missing in the general list.
        creature_status:
          $ref: '#/components/schemas/CreatureStatus'
    CreatureStatus:
      type: object
      description: |
        Status read from the hitpoints and experience paragraphs. Missing in the general list.
        summonable and convinceable can differ. They carry nothing leaves loot empty.
        paralysable is false only when the page says the creature cannot be paralysed.
        sees_invisible is true only when the page says the creature senses invisible creatures.
      required: [hitpoints, experience, loot, sometimes_other_items, immune, strong, weak, paralysable, summonable, convinceable, mana, sees_invisible]
      properties:
        hitpoints: {type: integer}
        experience: {type: integer}
        loot:
          type: array
          description: Items mentioned. Empty when the page says the creature carries nothing.
          items: {type: string}
        sometimes_other_items: {type: boolean}
        immune: {type: array, items: {type: string}}
        strong: {type: array, items: {type: string}}
        weak: {type: array, items: {type: string}}
        paralysable: {type: boolean}
        summonable: {type: boolean}
        convinceable: {type: boolean}
        mana:
          type: integer
          description: Mana to summon or convince. Zero when neither is possible.
        sees_invisible: {type: boolean}
    Creatures:
      type: object
      required: [count, boosted, updated_at, stale, creatures]
      properties:
        count:
          type: integer
          description: Number of creatures in creatures. On a race page, it is 1.
        boosted:
          type: object
          required: [name, race]
          properties:
            name: {type: string}
            race: {type: string}
        updated_at: {type: string, format: date-time, description: "UTC instant at which the page was read from tibia.com."}
        stale: {type: boolean, description: "True when the cache serves the page past its scheduled refresh, because the read failed (tibia.com maintenance, for one). updated_at shows its age."}
        creatures: {type: array, items: {$ref: '#/components/schemas/Creature'}}
    ExperienceTable:
      type: object
      required: [max_level, updated_at, stale, experience_table]
      properties:
        max_level:
          type: object
          description: Last level exposed in the table. The ceiling rises when the Tibia page starts listing a higher level.
          required: [level, experience]
          properties:
            level: {type: integer, example: 3500}
            experience: {type: integer, format: int64, example: 713359324800}
        updated_at: {type: string, format: date-time, description: "UTC instant at which the page was read from tibia.com."}
        stale: {type: boolean, description: "True when the cache serves the page past its scheduled refresh, because the read failed (tibia.com maintenance, for one). updated_at shows its age."}
        experience_table:
          type: array
          items:
            type: object
            required: [level, experience]
            properties:
              level: {type: integer}
              experience: {type: integer, format: int64}
    SpellList:
      type: object
      required: [count, updated_at, stale, spells]
      properties:
        count:
          type: integer
          description: Number of items in spells.
        updated_at: {type: string, format: date-time, description: "UTC instant at which the page was read from tibia.com."}
        stale: {type: boolean, description: "True when the cache serves the page past its scheduled refresh, because the read failed (tibia.com maintenance, for one). updated_at shows its age."}
        spells:
          type: array
          items:
            type: object
            required: [name, spell, words, group, type, level, mana, premium]
            properties:
              name: {type: string, example: Light Healing}
              spell: {type: string, description: Slug of the spell's link., example: lighthealing}
              words: {type: string, example: exura}
              group: {type: string, example: Healing}
              type: {type: string, example: Instant}
              level:
                type: integer
                nullable: true
                description: Exp Lvl from the page. null when the cell is "-".
                example: 8
              mana:
                description: A number, or "variable" when the page cell is "var.".
                oneOf:
                  - type: integer
                    example: 20
                  - type: string
                    enum: [variable]
              magic_type:
                type: string
                description: Magic Type from the page. "var." becomes "variable".
              premium: {type: boolean, example: false}
              image: {type: string, description: Present on a spell's page.}
              summary: {type: string, description: Story of the spell. Present on a spell's page.}
              vocations:
                type: array
                items: {type: string}
                description: Vocations that learn the spell.
              cooldown:
                type: object
                required: [seconds, group_seconds]
                properties:
                  seconds: {type: integer, example: 2}
                  group_seconds: {type: integer, example: 2}
              soul_points: {type: integer, description: Present when the page has Soul Points.}
              amount: {type: integer, description: Present when the page has Amount.}
              rune:
                type: object
                description: Rune Information. Only included for runes.
                required: [vocations, group, level, magic_level]
                properties:
                  vocations:
                    type: array
                    items: {type: string}
                  group: {type: string, example: Support}
                  level:
                    type: integer
                    nullable: true
                  magic_level: {type: integer, example: 4}
    WorldQuestRank:
      type: object
      required: [rank, date, worlds]
      description: "Worlds that finished on the same day. The rank is the page one: the next group starts at the position after this group's last world."
      properties:
        rank: {type: integer, minimum: 1}
        date: {type: string, format: date}
        worlds: {type: array, items: {type: string}}
    WorldQuest:
      type: object
      required: [name, type, description]
      properties:
        name: {type: string}
        type: {type: string, enum: [event, task]}
        status:
          type: string
          enum: [running, upcoming]
          description: Events only. running while it is on; upcoming while it has not started yet.
        description: {type: string}
        begins_on: {type: string, format: date, description: "Start of the next event, while it has not started yet."}
        ends_on: {type: string, format: date, description: End of the running event.}
        worlds_successful:
          type: array
          description: Detail only. Worlds that completed the quest.
          items: {$ref: '#/components/schemas/WorldQuestRank'}
        worlds_trying:
          type: array
          description: Detail only. Worlds still trying, for the running event.
          items: {type: string}
        worlds_failed:
          type: array
          description: Detail only. Worlds that failed.
          items: {$ref: '#/components/schemas/WorldQuestRank'}
    WorldQuestList:
      type: object
      required: [count, world_quests]
      properties:
        count:
          type: integer
          description: Number of items in world_quests. On the detail, it is 1.
        world_quests: {type: array, items: {$ref: '#/components/schemas/WorldQuest'}}
    MapArea:
      type: object
      required: [name, region, location]
      properties:
        name: {type: string}
        region: {type: string, description: Slug of the area link.}
        location: {type: string, description: "Page region, such as Main Continent, Zao or Islands."}
        category: {type: string, description: "Sub-region, such as Cities or Isles. Missing when the page has none."}
        image: {type: string, description: Detail only. Area map on static.tibia.com.}
        description: {type: string, description: "Detail only. Page paragraphs, separated by a blank line."}
    MapList:
      type: object
      required: [count, maps]
      properties:
        count:
          type: integer
          description: Number of items in maps. On the detail, it is 1.
        image: {type: string, description: List only. World map of the page.}
