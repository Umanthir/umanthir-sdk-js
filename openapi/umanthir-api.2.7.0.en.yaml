        Fixed weekly schedule, computed at request time: reads nothing from tibia.com or from the wiki.
        Rashid changes city at the server save, 10:00 Europe/Berlin, so before 10:00 he is still in the
        city of the day before. `since` and `until` are the server saves around the current game day,
        in UTC; `schedule` lists the whole week, from sunday to saturday. `image` links to the map on
        TibiaWiki BR. `Cache-Control` lasts until the next server save.
