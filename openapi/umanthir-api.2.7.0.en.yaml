  /v2/tools/exerciseweapons/{charges}:
    get:
      tags: [Tools]
      operationId: getExerciseWeaponsTime
      summary: "Time to spend exercise weapon charges"
      description: |
        Pure calculation: reads nothing from tibia.com. One charge is spent every 2 seconds, so
        `total_seconds` is `charges × 2`. Any amount is taken, so the charges of many weapons add up
        (an exercise weapon has 500 charges, a durable one 1800 and a lasting one 14400). `duration` splits
        the time into hours, minutes and seconds; hours do not roll into days. The answer never changes,
        so `Cache-Control` lasts one day.
      parameters:
        - name: charges
          in: path
          required: true
          description: "Charges to spend, from 1 to 1000000000000."
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 1000000000000
            example: 14400
      responses:
        '200':
          description: "Time to spend the charges."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseTime'
              examples:
                lasting:
                  summary: One lasting exercise weapon
                  value:
                    charges: 14400
                    total_seconds: 28800
                    duration: {hours: 8, minutes: 0, seconds: 0}
                    formatted: '08:00:00'
                many:
                  summary: Three lasting exercise weapons
                  value:
                    charges: 43200
                    total_seconds: 86400
                    duration: {hours: 24, minutes: 0, seconds: 0}
                    formatted: '24:00:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/tools/experience/level/{level}:
    get:
      tags: [Tools]
      operationId: getLevelExperience
      summary: "Experience needed for a level"
      description: |
        Pure calculation: reads nothing from tibia.com. Uses the official table, where level L needs
        50/3 × (L³ − 6L² + 17L − 12) experience. `next_level_experience` is what level + 1 needs and
        `to_next_level` the difference. The highest level taken is 821009, the last one whose experience fits
        in a 64-bit integer; there the next level fields are left out. The answer never changes,
        so `Cache-Control` lasts one day.
      parameters:
        - name: level
          in: path
          required: true
          description: "Level, from 1 to 821009."
          schema:
            type: integer
            minimum: 1
            maximum: 821009
            example: 100
      responses:
        '200':
          description: "Experience of the level and of the next one."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelExperience'
              examples:
                level:
                  summary: Level 100
                  value: {level: 100, experience: 15694800, next_level_experience: 16180000, to_next_level: 485200}
                top:
                  summary: Highest level taken
                  value: {level: 821009, experience: 9223363599763206400}
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/tools/experience/points/{experience}:
    get:
      tags: [Tools]
      operationId: getExperienceLevel
      summary: "Level of an amount of experience"
      description: |
        Pure calculation: reads nothing from tibia.com. `level` is the highest level whose experience fits
        in `experience`, from the same table as `/v2/tools/experience/level/{level}`. `progress` is the share
        of the level already done, from 0 to 1, and `exact_level` is `level` + `progress`, as the bar in the game.
        From the experience of level 821009 on, the level stays 821009 and the next level fields are left out.
        The answer never changes, so `Cache-Control` lasts one day.
      parameters:
        - name: experience
          in: path
          required: true
          description: "Experience, from 0 to 9223372036854775807."
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
            example: 16000000
      responses:
        '200':
          description: "Level of the experience and the progress inside it."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceStatus'
              examples:
                points:
                  summary: Inside level 100
                  value:
                    experience: 16000000
                    level: 100
                    exact_level: 100.6290189612531
                    level_experience: 15694800
                    next_level_experience: 16180000
                    to_next_level: 180000
                    progress: 0.6290189612530915
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/tools/serversave/{timeZone}:
    get:
      tags: [Tools]
      operationId: getServerSave
      summary: "Next server save in a time zone"
      description: |
        Computed at request time: reads nothing from tibia.com or from the wiki. The server save is at
        10:00 Europe/Berlin. `server_save_time` is that hour in the requested zone; it moves when either
        side changes between summer and winter time. `time_until` is how long until the next one, and its
        `text` shows hours and whole minutes. Exactly at 10:00, the next one is tomorrow's.
      parameters:
        - name: timeZone
          in: path
          required: true
          description: "IANA time zone. The slash may be literal or %2F: America/Sao_Paulo, America%2FSao_Paulo, UTC."
          schema: {type: string, maxLength: 64, example: America/Sao_Paulo}
      responses:
        '200':
          description: "The next server save, in the zone and in UTC, and how long until it."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                type: object
                required: [time_zone, server_save_time, utc_offset, next_server_save, next_server_save_utc, time_until]
                properties:
                  time_zone: {type: string, example: America/Sao_Paulo}
                  server_save_time: {type: string, example: '06:00'}
                  utc_offset: {type: string, example: '-03:00'}
                  next_server_save: {type: string, format: date-time, example: '2026-11-09T06:00:00-03:00'}
                  next_server_save_utc: {type: string, format: date-time, example: '2026-11-09T09:00:00Z'}
                  time_until:
                    type: object
                    required: [hours, minutes, total_seconds, text]
                    properties:
                      hours: {type: integer, example: 13}
                      minutes: {type: integer, example: 39}
                      total_seconds: {type: integer, example: 49140}
                      text: {type: string, example: '13 hours, 39 minutes'}
        '400':
          description: "Not the shape of an IANA name, or a zone that is not allowed, such as Local."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 400, message: Invalid time zone.}
        '404':
          description: "No such time zone."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Time zone not found.}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/tools/hunt/split:
    post:
      tags: [Tools]
      operationId: splitHunt
      summary: "Split the profit or waste of a party hunt"
      description: |
        Paste the text of the Party Hunt Analyzer, as copied from the game. Pure calculation: reads nothing
        from tibia.com, and the text is neither kept nor logged. A line without indent and without a colon opens
        a member (` (Leader)` sets `leader`); the indented `Key: value` lines below fill it in. `Balance` is
        required; `Loot`, `Supplies`, `Damage` and `Healing` default to 0, other keys are ignored. The session lines on top are
        skipped: the totals are summed from the members. The balance, profit or waste, is split evenly:
        `share` is rounded down and `remainder` (0 to members − 1 gold) stays with those who pay.
        `damage_percent` and `healing_percent` are the member's part of the party `damage` and `healing`, rounded to 2 decimals (0 when the total is 0).
        `difference` is the member's balance minus `share`: positive pays, negative is paid. `transfers`
        evens the party with at most members − 1 bank transfers, listed in the analyzer order, by payer and then by payee; `text` is the line for the
        bank NPC. Each answer belongs to its request: `Cache-Control: no-store` and no `ETag`.
      requestBody:
        required: true
        description: "Text of the Party Hunt Analyzer, up to 64 KB. At least two members."
        content:
          text/plain:
            schema:
              type: string
              maxLength: 65536
            examples:
              party:
                summary: Four members, profit
                value: |
                  Session data: From 2026-10-24, 09:22:21 to 2026-10-24, 11:49:20
                  Session: 02:26h
                  Loot Type: Leader
                  Loot: 37,346,426
                  Supplies: 10,586,766
                  Balance: 26,759,660
                  Aldor
                    Loot: 15,406,481
                    Supplies: 990,847
                    Balance: 14,415,634
                    Damage: 31,087,106
                    Healing: 5,312,882
                  Bryn
                    Loot: 53,601
                    Supplies: 1,541,659
                    Balance: -1,488,058
                    Damage: 35,836,000
                    Healing: 15,399,191
                  Cael Var (Leader)
                    Loot: 19,643,824
                    Supplies: 3,026,175
                    Balance: 16,617,649
                    Damage: 22,221,354
                    Healing: 10,163,264
                  Dorin
                    Loot: 2,242,520
                    Supplies: 5,028,085
                    Balance: -2,785,565
                    Damage: 51,284,298
                    Healing: 3,893,937
      responses:
        '200':
          description: "Even split and the transfers that settle it."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HuntSplit'
              examples:
                party:
                  summary: Four members, profit
                  value:
                    session: {date: '2026-10-24', start_time: '09:22:21', duration: '02:26', duration_minutes: 146}
                    loot: 37346426
                    supplies: 10586766
                    balance: 26759660
                    share: 6689915
                    remainder: 0
                    damage: 140428758
                    healing: 34769274
                    members:
                      - {name: Aldor, leader: false, loot: 15406481, supplies: 990847, balance: 14415634, difference: 7725719, damage: 31087106, healing: 5312882, damage_percent: 22.14, healing_percent: 15.28}
                      - {name: Bryn, leader: false, loot: 53601, supplies: 1541659, balance: -1488058, difference: -8177973, damage: 35836000, healing: 15399191, damage_percent: 25.52, healing_percent: 44.29}
                      - {name: Cael Var, leader: true, loot: 19643824, supplies: 3026175, balance: 16617649, difference: 9927734, damage: 22221354, healing: 10163264, damage_percent: 15.82, healing_percent: 29.23}
                      - {name: Dorin, leader: false, loot: 2242520, supplies: 5028085, balance: -2785565, difference: -9475480, damage: 51284298, healing: 3893937, damage_percent: 36.52, healing_percent: 11.2}
                    transfers:
                      - {from: Aldor, to: Bryn, amount: 7725719, text: "Aldor: transfer 7725719 to Bryn"}
                      - {from: Cael Var, to: Bryn, amount: 452254, text: "Cael Var: transfer 452254 to Bryn"}
                      - {from: Cael Var, to: Dorin, amount: 9475480, text: "Cael Var: transfer 9475480 to Dorin"}
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: "The text is over 64 KB: `Hunt too large.`"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/wiki/rashid/location:
    get:
      tags: [Wiki]
