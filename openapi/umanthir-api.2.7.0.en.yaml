            base: {type: integer}
            basic_imbuement: {type: integer}
            intricate_imbuement: {type: integer}
            powerful_imbuement: {type: integer}
        regeneration: {$ref: '#/components/schemas/VocationRegen'}
        promoted:
          type: object
          description: "What changes with the promotion: the name and the regeneration."
          required: [name, regeneration]
          properties:
            name: {type: string, example: Elite Knight}
            regeneration: {$ref: '#/components/schemas/VocationRegen'}
    SkillState:
      type: object
