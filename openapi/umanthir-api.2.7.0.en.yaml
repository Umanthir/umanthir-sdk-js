        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/tools/online:
    get:
      tags: [Tools]
      operationId: getOnlineBatch
      summary: Who is online in several worlds, in one call
      description: |
        Reads the Players Online list of each requested world. Each world comes with the time
        of the read (`updated_at`). The list is never older than 30 s; when the new read fails,
        the last good list (up to 5 min) comes with `stale: true`. One call counts 1 against the quota,
        whatever the number of worlds. An `If-None-Match` equal to the `ETag` responds
        304 without counting against the quota. The `ETag` covers `worlds`, `unknown` and `failed`, and leaves
        `fetched_at` and each world's `updated_at` out: it only changes when who is
        online changes (or `stale`, `unknown`, `failed`). A re-read that finds the same
        players keeps responding 304; on a 304, the newest `updated_at` does not reach the
        client.

        The route only reads tibia.com on demand and protects the server against blocking: few
        reads at the same time, spaced out, with a per-minute ceiling and a growing pause
        when tibia.com responds 403, 429 or 503. A world held back by this protection
        goes into `failed` with 503 `Upstream busy.`.

        The list of valid worlds, which separates `unknown` from `failed`, holds until the next
        server save (10:00 Berlin time). If tibia.com fails, the last good list stays
        valid.
      parameters:
        - name: worlds
          in: query
          required: true
          description: Worlds separated by commas, or the parameter repeated. Up to 100, not counting duplicates. Case-insensitive; leading and trailing spaces are ignored.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: {type: string}
          example: [Antica, Yonabra]
        - name: fields
          in: query
          description: "`names` returns only the names in `online`; `full` (default) returns OnlinePlayer."
          schema:
            type: string
            enum: [full, names]
            default: full
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Online players per world, in request order, with unknown worlds and failures apart.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              schema: {type: string, example: 'public, max-age=30'}
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineBatch'
              examples:
                names:
                  summary: fields=names
                  value:
                    fetched_at: '2026-10-16T17:40:15Z'
                    worlds:
                      - name: Antica
                        players_online: 3
                        updated_at: '2026-10-16T17:40:02Z'
                        stale: false
                        online: [Aczza Kina, Njorn, Sheng]
                      - name: Yonabra
                        players_online: 0
                        updated_at: '2026-10-16T17:39:58Z'
                        stale: false
                        online: []
                    unknown: [Gladeraa]
                    failed: []
                full:
                  summary: fields=full (default)
                  value:
                    fetched_at: '2026-10-16T17:40:15Z'
                    worlds:
                      - name: Antica
                        players_online: 1
                        updated_at: '2026-10-16T17:40:02Z'
                        stale: false
                        online:
                          - {name: Sheng, level: 2455, share_experience: {min: 1636, max: 3682}, vocation: Elder Druid}
                    unknown: []
                    failed:
                      - {name: Yonabra, status_code: 520, message: Upstream request failed.}
        '304':
          description: Nothing changed since the ETag sent. No body. Does not count against the quota.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/UpstreamBusy'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/tools/online/{name}:
    get:
      tags: [Tools]
      operationId: getOnline
      summary: Tells whether the character is online in their world
