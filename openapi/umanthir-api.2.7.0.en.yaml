        '404':
          description: "Table missing, or a slug missing from the cached list."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Spells data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/library/worldquests:
    get:
      tags: [Library]
      operationId: getWorldQuests
      summary: World events and world tasks from the library
      description: |
        Without `worldquest`, reads the list: the running events, the upcoming events and the world tasks,
        in that order. `type` is `event` or `task`. Events carry `status` (`running` or `upcoming`) and the
        page date: `ends_on` for the running event, `begins_on` for an upcoming one. Tasks have no date.

        With `worldquest`, opens the quest's page and `count` is 1. The item gains `worlds_successful`,
        `worlds_trying` and `worlds_failed`, always present on the detail (empty when the page says
        "No world..."). Ranked worlds come grouped: each group has `rank`, `date` and the tied worlds,
        as on the page. The name is case-insensitive and goes into the source URL escaped.
      parameters:
        - name: worldquest
          in: query
          description: Name of a quest, such as A Piece of Cake. Empty lists the general page. `/`, `\`, `?`, `#`, `&` and `%` respond 400.
          schema:
