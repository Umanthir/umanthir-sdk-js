              example:
                category: {slug: axes, name: Axes, group: weapons}
                name: Hellforged Axe
                title: Hellforged Axe
                class: Armas
                type: Machados
                subtype: null
                level_required: 110
                vocations: []
                weight: 88
                attack: 51
                defense: 28
                defense_mod: 2
                armor: null
                hands: 1
                element_attack: null
                skill_boosts: []
                resistances: []
                classification: 3
                max_tier: 3
                imbuement_slots: 1
                perks: ['+2.00% damage contra bosses e Sinister Embraced', '+6.66% do seu Axe Fighting como extra damage para auto-attacks']
                dropped_by: [Ferumbras Mortal Shell]
                value: '180 000 - 450 000'
                npc_price: 0
                buy_from: Jogadores.
                sell_to: Jogadores.
                stackable: null
                enchantable: false
                implemented: '8.2'
                notes: '* Pode ser obtido como recompensa da The Inquisition Quest.'
                attributes: {droppedraidby: Ferumbras.}
                image_url: 'https://www.tibiawiki.com.br/images/1/1e/Hellforged_Axe.gif'
                wiki_url: 'https://www.tibiawiki.com.br/wiki/Hellforged_Axe'
                updated_at: '2026-10-25T17:10:50Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/WikiNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/WikiUnavailable'
  /v2/tools/experience/goal/{level}:
    get:
      tags: [Tools]
      operationId: getExperienceGoal
      summary: "Experience left to a target level"
      description: |
        Pure calculation: reads nothing from tibia.com. `{level}` is the target and the start is either
        the current `level` or the current `experience`: pass exactly one of them. With `experience`, `level` in
        the answer is the level that experience reaches, and the experience is kept as is, not rounded down to it.
        `needed_experience` is `target_experience` − `experience`, from the same table as
        `/v2/tools/experience/level/{level}`. `progress` is the share of `target_experience` already held,
        from 0 to 1. A target at or below the start answers 200 with `needed_experience` 0, `progress` 1 and
        `reached` true. The answer never changes, so `Cache-Control` lasts one day.
      parameters:
        - name: level
          in: path
          required: true
          description: "Target level, from 1 to 821009. Anything else responds 400 `Invalid target level.`."
          schema:
            type: integer
            minimum: 1
            maximum: 821009
            example: 200
        - name: level
          in: query
          required: false
          description: "Current level, from 1 to 821009, instead of `experience`. Anything else responds 400 `Invalid level.`; both or neither respond 400 `Pass level or experience.`."
          schema:
            type: integer
            minimum: 1
            maximum: 821009
            example: 150
        - name: experience
          in: query
          required: false
          description: "Current experience, from 0 to 9223372036854775807, instead of `level`. Anything else responds 400 `Invalid experience.`."
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
            example: 16000000
      responses:
        '200':
          description: "Experience left to the target and the share already held."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperienceGoal'
              examples:
                level:
                  summary: From level 150 to 200
                  value:
                    level: 150
                    experience: 54042300
                    target_level: 200
                    target_experience: 129389800
                    needed_experience: 75347500
                    progress: 0.41767048098072646
                    reached: false
                experience:
                  summary: From an amount of experience inside level 100
                  value:
                    level: 100
                    experience: 16000000
                    target_level: 200
                    target_experience: 129389800
                    needed_experience: 113389800
                    progress: 0.12365735166141381
                    reached: false
                reached:
                  summary: Target already reached
                  value:
                    level: 200
                    experience: 129389800
                    target_level: 100
                    target_experience: 15694800
                    needed_experience: 0
                    progress: 1
                    reached: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/docs:
