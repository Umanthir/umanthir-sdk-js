  /v2/tools/experience/share/{levels}:
    get:
      tags: [Tools]
      operationId: getShareExperience
      summary: "Share experience range of a level or a party"
      description: |
        Pure calculation: reads nothing from tibia.com, so maintenance and upstream failures do not affect it.
        Each level gets the same `share_experience` range as the character profile:
        `min` is the integer part of level / 3 * 2 and `max` the integer part of level / 2 * 3.

        With more than one level (the party), `party.shared_range` is the overlap of every range
        (the highest `min` and the lowest `max`), left out when the ranges do not overlap.
        `party.can_share` is true when every level of the party is inside `shared_range`. The answer never
        changes, so `Cache-Control` lasts one day.
      parameters:
        - name: levels
          in: path
          required: true
          description: "One level, or up to 100 levels split by commas. Each level from 1 to 100000."
          schema:
            type: string
            example: '35,50,60'
      responses:
        '200':
          description: "Range of each level and of the party."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareExperience'
              examples:
                single:
                  summary: Njorn alone
                  value:
                    levels:
                      - {level: 35, share_experience: {min: 23, max: 52}}
                    party: {lowest: 35, highest: 35, can_share: true, shared_range: {min: 23, max: 52}}
                party:
                  summary: Party that cannot share
                  value:
                    levels:
                      - {level: 23, share_experience: {min: 15, max: 34}}
                      - {level: 35, share_experience: {min: 23, max: 52}}
                    party: {lowest: 23, highest: 35, can_share: false, shared_range: {min: 23, max: 34}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/tools/vocationstatus/{vocation}/{level}:
    get:
      tags: [Tools]
      operationId: getVocationStatus
      summary: "Status of a vocation at a level"
      description: |
        Pure calculation: reads nothing from tibia.com, so maintenance and upstream failures do not affect it.

        Up to level 8 every character gains as one without vocation: hitpoints = 145 + 5 × level,
        mana = 50 + 5 × level and capacity = 390 + 10 × level. From level 9 on, the gain of the vocation
        adds to the level 8 values (185 hitpoints, 90 mana, 470 capacity) for each level above 8:
        Druid and Sorcerer 5/30/10, Knight 15/5/25, Monk 10/10/25, Paladin 10/15/20 (hitpoints/mana/capacity).

        `capacity` also brings the capacity with each tier of the capacity imbuement (+3%, +8% and +15%,
        rounded down). `regeneration` is the one without promotion. The promotion does not change hitpoints,
        mana or capacity, so `promoted` brings only the name of the promoted vocation and its `regeneration`.
        The answer never changes, so `Cache-Control` lasts one day.
      parameters:
        - name: vocation
          in: path
          required: true
          description: "Base vocation, without regard to case: druid, knight, monk, paladin or sorcerer. The promoted names are not taken; the answer brings the promoted vocation."
          schema:
            type: string
            enum: [druid, knight, monk, paladin, sorcerer]
            example: knight
        - name: level
          in: path
          required: true
          description: "Level from 1 to 100000."
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            example: 100
      responses:
        '200':
          description: "Status of the vocation at the level, with the promoted vocation."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocationStatus'
              examples:
                knight:
                  summary: Knight at level 100
                  value:
                    vocation: Knight
                    level: 100
                    hitpoints: 1565
                    mana: 550
                    capacity: {base: 2770, basic_imbuement: 2853, intricate_imbuement: 2991, powerful_imbuement: 3185}
                    regeneration: {life: {points: 1, seconds: 6}, mana: {points: 2, seconds: 6}}
                    promoted:
                      name: Elite Knight
                      regeneration: {life: {points: 1, seconds: 4}, mana: {points: 2, seconds: 6}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v2/tools/skills/raw:
    get:
      tags: [Tools]
      operationId: getRawSkills
      summary: "Raw skills, without the loyalty bonus"
      description: |
        Loyalty raises the skills shown while the character is online. This calculator takes that bonus out
        and returns the raw skills, the ones without it. Pure calculation: reads nothing from tibia.com.

        Send each skill as `level,percent_left`, where `percent_left` is how much is left to the next level
        (30 means 70% of the way is done). One or more of `magic`, `fist`, `club`, `sword`, `axe`, `distance`,
        `shielding` and `fishing` per call; the answer keeps that order. Send the loyalty as `loyalty`
        (bonus from 0 to 50) or as `loyalty_points` (5% every 360 points, up to 50%), not both.

        Points of a level: `C × (f^(level − offset) − 1) / (f − 1)`, with C/offset 1600/0 for magic,
        50/10 for fist, club, sword and axe, 25/10 for distance, 100/10 for shielding and 20/10 for fishing,
        and `f` the factor of the vocation for that skill. The online points are divided by 1 + bonus/100
        and turned back into a level and `percent_left`. The answer never changes, so `Cache-Control` lasts
        one day.
      parameters:
        - name: vocation
          in: query
          required: true
          description: "Vocation: none, druid, knight, monk, paladin or sorcerer, without regard to case."
          schema:
            type: string
            enum: [none, druid, knight, monk, paladin, sorcerer]
            example: knight
        - name: loyalty
