        topic: {type: string}
        ends_on: {type: string, format: date}
    ClosedPoll:
      type: object
      required: [id, topic, ended_on]
      properties:
        id: {type: integer, description: "questionaireid of the poll on tibia.com. The details need a login there."}
        topic: {type: string}
        ended_on: {type: string, format: date}
    ClosedPolls:
      type: object
      required: [page, total_pages, total, polls]
      properties:
        page: {type: integer}
        total_pages: {type: integer, description: "Number of pages of closed polls."}
        total: {type: integer, description: "Number of closed polls, as the page states."}
        polls: {type: array, items: {$ref: '#/components/schemas/ClosedPoll'}}
    Polls:
      type: object
      required: [active, closed]
      properties:
        active:
          type: array
          description: "Open polls. The same on every page."
          items: {$ref: '#/components/schemas/ActivePoll'}
        closed:
          $ref: '#/components/schemas/ClosedPolls'
    Fansite:
      type: object
      required: [name, url, contact, content, social_media, languages, specials]
      properties:
        name: {type: string}
        url: {type: string, description: "Fansite link. Only http or https; a row with another scheme is left out. External link: open it with rel=noopener."}
        logo: {type: string, description: "Logo on static.tibia.com."}
        contact: {type: string, description: "Contact character of the fansite."}
        content: {type: array, items: {type: string}, description: "Content types, such as Statistics, Texts, Tools or Wiki."}
        social_media: {type: array, items: {type: string}, description: "Social media, such as Discord, Instagram or Youtube. Only the label, no link."}
        languages: {type: array, items: {type: string}, description: "Language codes, such as en or pt."}
        specials: {type: array, items: {type: string}, description: "Specials of the fansite, as the page writes them."}
        item: {type: string, description: "Image of the fansite item on static.tibia.com. Missing when the fansite has none."}
    Fansites:
      type: object
      required: [count, updated_at, stale, promoted, supported]
      properties:
        count: {type: integer, description: "Sum of promoted and supported."}
        updated_at: {type: string, format: date-time, description: "UTC instant at which the list was read from tibia.com."}
        stale: {type: boolean, description: "True when the cache serves the list past its scheduled refresh, because the read failed (tibia.com maintenance, for one). updated_at shows its age."}
        promoted: {type: array, items: {$ref: '#/components/schemas/Fansite'}}
        supported: {type: array, items: {$ref: '#/components/schemas/Fansite'}}
    Online:
      type: object
      required: [name, level, share_experience, vocation, online]
      properties:
        name: {type: string}
        level: {type: integer}
        share_experience:
          $ref: '#/components/schemas/Share'
        vocation: {type: string}
        online: {type: boolean}
    ShareLevel:
      type: object
      description: "Level and its share experience range, as in the character profile."
