  /v2/community/houses/{world}/{town}:
    get:
      tags: [Community]
      operationId: getHouses
      summary: Houses or guildhalls of a town
      description: |
        Reads the house search of the world and town, with the form filters. Each row carries `house_id`,
        `name`, `size` (square meters), `rent` (gold; `50k` becomes 50000 and `1kk` becomes 1000000) and `status`.
        In an auction, `auction` carries `current_bid` (null before the first bid) and `time_left`, as the page writes it.

        tibia.com matches the world and town case-sensitively and answers a wrong name with the bare form.
        That is why the world goes out with a capital first letter, and the town goes out as the form spells it
        when it is a known one (case-insensitive). A new town also works: each word gets a capital first letter,
        and the page caption has to name that world and town; otherwise it responds 404.
      parameters:
        - $ref: '#/components/parameters/WorldPath'
        - $ref: '#/components/parameters/HouseTown'
        - $ref: '#/components/parameters/HouseState'
        - $ref: '#/components/parameters/HouseType'
        - $ref: '#/components/parameters/HouseOrder'
      responses:
        '200':
          description: Search rows. Empty list when the page says no houses were found.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseList'
              example:
                world: Antica
                town: Thais
                type: houses
                count: 3
                houses:
                  - {house_id: 10301, name: 'Alai Flats, Flat 01', size: 17, rent: 50000, status: rented}
                  - {house_id: 10302, name: 'Alai Flats, Flat 02', size: 17, rent: 50000, status: auctioned, auction: {current_bid: null}}
                  - {house_id: 10303, name: 'Alai Flats, Flat 03', size: 17, rent: 50000, status: auctioned, auction: {current_bid: 0, time_left: 4 days}}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/HousesNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
