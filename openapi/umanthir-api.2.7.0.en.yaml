  /v2/library/spells:
    get:
      tags: [Library]
      operationId: getSpells
      summary: Library spell list
      description: |
        Without `spell`, returns the general list. `count` is the size of `spells`.
        `level` is null when the page cell is "-". `mana` and `magic_type` become "variable" when the cell is "var.".
        The order is the table's order.

        With `spell`, opens that spell's page and `count` is 1.
        The item gains `image`, `summary`, `vocations` and `cooldown`.
        `magic_type`, `soul_points` and `amount` are included when the page has the row.
        Runes gain `rune`. The source URL only receives the validated slug.

        The page changes rarely, so the API reads it once a day, at 10:10 Berlin time (after the server save), and
        when the service starts, and answers from memory. `updated_at` tells when it was read and `stale` is true when
        a failed read left the last good answer in place; a new attempt runs every 15 minutes. `Cache-Control` lasts
        until the next refresh.

        The pages are cached the same way: the list once a day, and each spell or creature page once a day, read on
        first use. Only a name in the cached list opens a page; any other name is a 404 without a read to tibia.com.
        `updated_at`, `stale` and `Cache-Control` follow the cache of the page served.
      parameters:
        - name: spell
          in: query
          description: Slug of a spell, such as animatedeadrune. Empty lists the general page.
          schema:
            type: string
            example: animatedeadrune
      responses:
        '200':
          description: Full list from the page.
          headers:
