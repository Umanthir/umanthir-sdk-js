        loyalty:
          type: object
          required: [bonus]
          properties:
            bonus: {type: integer}
            points: {type: integer}
        skills:
          type: array
          items:
            type: object
            required: [skill, online, raw]
            properties:
              skill: {type: string, enum: [magic, fist, club, sword, axe, distance, shielding, fishing]}
              online: {$ref: '#/components/schemas/SkillState'}
              raw: {$ref: '#/components/schemas/SkillState'}
