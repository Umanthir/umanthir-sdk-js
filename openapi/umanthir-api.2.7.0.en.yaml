                  - name: A reliable Friend
                    grade: 1
                    points: {min: 1, max: 3}
                    description: The hungry ram devoured the whole bunch of turnips in a single bite, then looked at you as if it was ready for more. Make sure to keep it well fed along the way.
                  - name: Arsenal of War
                    grade: 3
                    points: {min: 7, max: 9}
                    description: Feared by your enemies, admired by many - your reputation in weapon mastery precedes you.
