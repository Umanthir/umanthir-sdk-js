  /v2/library/creatures:
    get:
      tags: [Library]
      operationId: getCreatures
      summary: Library creatures
      description: |
        Without `creature_race`, returns the general list. `count` is the size of `creatures`.
        Each item carries only `name`, `race` and `image`.

        With `creature_race`, opens that creature's page and `count` is 1.
        `summary` holds the story. The hitpoints and experience paragraphs
        leave `summary` and become `creature_status`.

        `summonable` and `convinceable` can differ. 690 mana to summon,
        without convincing, gives `summonable` true, `convinceable` false and `mana` 690.
        `They carry nothing` leaves `loot` empty. `paralysable` is false only when
        the page says the creature cannot be paralysed. `sees_invisible` is
        true only when the page says the creature senses invisible creatures.

        The boosted creature of the day stays in the response. Without the list and without the creature's page, the response is 404.

        The page changes rarely, so the API reads it once a day, at 10:10 Berlin time (after the server save), and
        when the service starts, and answers from memory. `updated_at` tells when it was read and `stale` is true when
        a failed read left the last good answer in place; a new attempt runs every 15 minutes. `Cache-Control` lasts
        until the next refresh.

        The pages are cached the same way: the list once a day, and each spell or creature page once a day, read on
        first use. Only a name in the cached list opens a page; any other name is a 404 without a read to tibia.com.
        `updated_at`, `stale` and `Cache-Control` follow the cache of the page served.

        The boosted creature changes at the server save (10:00 Berlin time); the cached answer shows it from 10:10.
      parameters:
        - name: creature_race
          in: query
          description: Race of a creature, such as demon. Empty lists the general page.
          schema:
            type: string
            example: demon
      responses:
        '200':
          description: Count, boosted creature and the list. On a race page, each item includes summary and creature_status.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creatures'
              examples:
                demon:
                  summary: Demon page
                  value:
                    count: 1
                    boosted: {name: Crape Man, race: crapeman}
                    updated_at: '2026-10-23T08:10:02Z'
                    stale: false
                    creatures:
                      - name: Demons
                        race: demon
                        image: https://static.tibia.com/images/library/demon.gif
                        summary: |
                          The famous knight Apoc once wrote: "Demons are the most malevolent, powerful, and dangerous creatures in Tibia. In addition to their awesome physical strength, they can also use powerful spells, such as fireballs and fire fields. Especially dangerous is their gaze, which can produce beams of pure energy to annihilate their poor victims. Moreover, they drain mana off their victims, heal themselves and summon fire elementals as their vassals.

                          Fortunately, Demons usually live in the deepest dungeons near hell but sometimes they appear also on the surface. When they do, they leave a track of death and destruction behind them. Nobody has ever been able to slay even one of these entities and only very few adventurers have survived an encounter with them."
                        creature_status:
                          hitpoints: 8200
                          experience: 6000
                          loot:
                            - assassin stars
                            - demon horns
                            - demonic essence
                            - fire mushrooms
                            - gold coins
                            - great mana potions
                            - great spirit potions
                            - platinum coins
                            - small amethysts
                            - small emeralds
                            - small rubies
                            - small topazes
                            - ultimate health potions
                          sometimes_other_items: true
                          immune: [fire]
                          strong: [death, earth, energy, physical]
                          weak: [holy, ice]
                          paralysable: false
                          summonable: false
                          convinceable: false
                          mana: 0
                          sees_invisible: true
                fireelemental:
                  summary: Fire elemental page
                  value:
                    count: 1
                    boosted: {name: Crape Man, race: crapeman}
                    updated_at: '2026-10-23T08:10:02Z'
                    stale: false
                    creatures:
                      - name: Fire Elementals
                        race: fireelemental
                        image: https://static.tibia.com/images/library/fireelemental.gif
                        summary: Fire Elementals are entities consisting only of fire. They have been spotted in the wake of demons, and nobody knows whether they are summoned by them or whether they are independent creatures rising out of fire. They are very dangerous fighters and create fire fields or shoot fireballs at their opponents.
                        creature_status:
                          hitpoints: 280
                          experience: 220
                          loot: []
                          sometimes_other_items: false
                          immune: [death, fire]
                          strong: []
                          weak: [ice]
                          paralysable: false
                          summonable: true
                          convinceable: false
                          mana: 690
                          sees_invisible: true
                lista:
                  summary: General list
                  description: The live list carries the whole catalogue. This example only shows the shape, without summary and without creature_status.
                  value:
                    count: 2
                    boosted: {name: Crape Man, race: crapeman}
                    updated_at: '2026-10-23T08:10:02Z'
                    stale: false
                    creatures:
                      - name: Acid Blobs
                        race: acidblob
                        image: https://static.tibia.com/images/library/acidblob.gif
                      - name: Demons
                        race: demon
                        image: https://static.tibia.com/images/library/demon.gif
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: "Without the list, or a race missing from the cached list."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Creatures data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
