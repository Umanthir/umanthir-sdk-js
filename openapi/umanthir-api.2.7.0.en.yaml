      properties:
        life: {$ref: '#/components/schemas/Regen'}
        mana: {$ref: '#/components/schemas/Regen'}
    VocationStatus:
      type: object
      description: "Status of a vocation at a level. regeneration is the one without promotion."
      required: [vocation, level, hitpoints, mana, capacity, regeneration, promoted]
      properties:
        vocation: {type: string, example: Knight}
        level: {type: integer}
        hitpoints: {type: integer}
        mana: {type: integer}
        capacity:
          type: object
          description: "Capacity, and the capacity with the basic, intricate and powerful capacity imbuement."
