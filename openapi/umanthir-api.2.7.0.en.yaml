openapi: 3.0.3
info:
  title: Umanthir API
  version: 2.7.0
  description: |
    Umanthir API v2. Reads public pages from tibia.com and returns JSON.

    The `/tibia` segment does not exist in this version.
    A missing character responds 404. An upstream failure responds 502 or 520, with the
    standard error body and no raw HTML.

    CET/CEST dates are returned as ISO-8601 UTC, with the fixed time zone Europe/Berlin.
    NBSP (U+00A0) becomes a space before names are compared and URLs are built.

    The interactive page is at `GET /v2/docs/en` (English, the default for `GET /v2/docs`)
    and at `GET /v2/docs/pt-BR` (Brazilian Portuguese).
    When tibia.com goes into maintenance, it redirects everything to maintenance.tibia.com. The API
    recognises it, answers 503 `Tibia.com is under maintenance.` with `Retry-After`, and stops calling
    tibia.com for 5 minutes; after that, one probe at a time checks whether it is back.

    Every read of tibia.com, from every route, goes through one shared ceiling. A Cloudflare
    challenge pauses all reads for 30 minutes, a 429 for its `Retry-After`, and a 403 or 503 for
    a growing pause; then one probe checks whether reads may go on.

    tibia.com pages are cached per route: worlds 60 s, guilds 5 min, houses, highscores and Drome
    15 min, polls 30 min, character profiles 5 min. Pages that tibia.com renews once a day follow its
    clock (Europe/Berlin): achievements, maps and world quests until 10:10 (server save plus
    10 minutes), kill statistics until 03:10. When tibia.com cannot be read, the last good page is
    still served for up to 6 hours after it expired. Every answer
    built from tibia.com data carries `X-Umanthir-Data-Age` (seconds since the oldest page was read)
    and `X-Umanthir-Data-State` (`fresh` or `stale`).

    Any website may call the API from the browser (CORS `Access-Control-Allow-Origin: *`).
    The preflight `OPTIONS` answers 204 and allows `Authorization`, `Content-Type` and
    `If-None-Match`; it does not count against the rate limit. No cookies are used.

    A token is optional: `Authorization: Bearer umt_live_<id>_<secret>`, created in the Umanthir
    portal. Without a token, the anonymous limit per IP applies. With a token, the plan's limits apply:
    a peak per minute per token, and a monthly quota (and, on some plans, a daily one) per application.
    A token that is unknown, revoked or expired answers 401 `Invalid token.` A used up quota answers
    429 with `Retry-After` until the first day of next month (or next day) at 00:00 UTC. If the token
    cannot be checked for a moment, the request is served as anonymous.

    A site key is a token made for one website: it is accepted only from that site's exact origins
    (`Origin`, else `Referer`), with a cap per visitor IP. From another origin, or without one, it
    answers 403 with `code: origin_not_allowed`, and the answer echoes the accepted origin in
    `Access-Control-Allow-Origin` with `Vary: Origin`. A refused request does not count.
security:
  - {}
  - PortalToken: []
servers:
  - url: http://127.0.0.1:8081
    description: Local process. The binary's default port is 8080; the Postman collection uses 8081.
  - url: https://api.umanthir.com
    description: Public host. The certificate is served with the full chain.
tags:
  - name: Community
    x-displayName: Community
  - name: Library
    x-displayName: Library
  - name: Tools
    x-displayName: Tools
  - name: Wiki
    x-displayName: Wiki
  - name: Docs
    x-displayName: Docs
paths:
  /v2/community/characters/{name}:
    get:
      tags: [Community]
      operationId: getCharacter
      summary: Character profile
      parameters:
        - $ref: '#/components/parameters/CharacterName'
      responses:
        '200':
          description: Profile. `deaths` is always present, empty when there are no deaths.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            X-Umanthir-Data-Age:
              $ref: '#/components/headers/XUmanthirDataAge'
            X-Umanthir-Data-State:
              $ref: '#/components/headers/XUmanthirDataState'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
              example:
                character_information:
                  name: Njorn
                  level: 35
                  share_experience: {min: 23, max: 52}
                  vocation: Master Sorcerer
                  world: Antica
                  former_worlds: [Lobera, Antica]
                deaths: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Character not found.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Could not find character.}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/CharacterUpstreamFailed'
  /v2/community/highscores:
    get:
      tags: [Community]
      operationId: getHighscores
      summary: One highscores page
      description: |
        Reads only `table.TableContent` from the official page. `world` goes into the Tibia URL
        with a capital first letter (`antica` becomes `Antica`). The `name` query does not filter this list.
        A page past the last one, or above 20, responds 404.
      parameters:
        - $ref: '#/components/parameters/World'
        - $ref: '#/components/parameters/HighscoreCategory'
        - $ref: '#/components/parameters/Vocation'
        - $ref: '#/components/parameters/Protection'
        - $ref: '#/components/parameters/WorldTypes'
        - $ref: '#/components/parameters/WorldTypesBracket'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Ranking page.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighscorePage'
              example:
                highscores:
                  page: 1
                  last_update: '2026-10-13T13:30:00Z'
                  category: experience
                  rank_list_size: 1
                  world: Antica
                  rank_list:
                    - {rank: 1, name: Alpha, vocation: Elite Knight, world: Antica, level: 100, value: 1000}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Page without a ranking, or a page past the last one.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Highscores' data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/highscores/character/{name}:
    get:
      tags: [Community]
      operationId: getCharacterHighscore
      summary: A character's position in the top 1000
      description: |
        Accepts the same filters as the list. An empty `category` means `experience`.
        The client's `page` is not used: the search walks up to 20 pages of the filtered ranking.
        Outside the top 1000 responds 404. An unknown filter responds 400.
        The response stays `{ rank, level, value }`.
      parameters:
        - $ref: '#/components/parameters/CharacterName'
        - $ref: '#/components/parameters/World'
        - $ref: '#/components/parameters/HighscoreCategory'
        - $ref: '#/components/parameters/Vocation'
        - $ref: '#/components/parameters/Protection'
        - $ref: '#/components/parameters/WorldTypes'
        - $ref: '#/components/parameters/WorldTypesBracket'
      responses:
        '200':
          description: Position found.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankHit'
              example: {rank: 12, level: 800, value: 123456}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Character outside the top 1000, or an invalid name in the scrape.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Could not find character.}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/worlds:
    get:
      tags: [Community]
      operationId: getWorlds
      summary: List of worlds, or the details of one world
      parameters:
        - $ref: '#/components/parameters/World'
      responses:
        '200':
          description: Without `world`, the list. With `world`, the details and who is online.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorldList'
                  - $ref: '#/components/schemas/WorldDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: List or world without data.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Worlds' data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/drome/rotations:
    get:
      tags: [Community]
      operationId: getDromeRotations
      summary: Current rotation and the previous one
      responses:
        '200':
          description: The open rotation and the one that closed.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rotations'
        '404':
          description: Rotation select missing.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Drome Rotation's data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/drome/rotations/{world}:
    get:
      tags: [Community]
      operationId: getDromeWorld
      summary: Drome ranking of a world, page 1
      parameters:
        - $ref: '#/components/parameters/WorldPath'
      responses:
        '200':
          description: First page of the ranking.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DromeRank'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Ranking missing.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Drome Rotation's data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/drome/rotations/{world}/{page}:
    get:
      tags: [Community]
      operationId: getDromeWorldPage
      summary: Drome ranking of a world on one page
      parameters:
        - $ref: '#/components/parameters/WorldPath'
        - $ref: '#/components/parameters/PagePath'
      responses:
        '200':
          description: Requested page of the ranking.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DromeRank'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Ranking missing.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Drome Rotation's data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/killstatistics/{world}:
    get:
      tags: [Community]
      operationId: getKillStatistics
      summary: Kill statistics of a world
      description: |
        Reads the world kill statistics: one row per race, in page order, with the last day
        (`last_day`) and the last week (`last_week`). `killed_players` is how many players the race killed;
        `killed_by_players` is how many of the race players killed. The page Total row comes out in `total`,
        apart from `entries`.

        tibia.com matches the world case-sensitively and answers a wrong name with the bare selector. That is
        why the world goes out with a capital first letter (`antica` becomes `Antica`), and the page only
        counts when the selector shows that world as chosen. The source URL only receives `subtopic` and the escaped world.
      parameters:
        - $ref: '#/components/parameters/WorldPath'
      responses:
        '200':
          description: Rows per race and the world total.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillStatistics'
              example:
                world: Antica
                count: 2
                entries:
                  - race: (elemental forces)
                    last_day: {killed_players: 15, killed_by_players: 0}
                    last_week: {killed_players: 105, killed_by_players: 0}
                  - race: Abyssador
                    last_day: {killed_players: 0, killed_by_players: 2}
                    last_week: {killed_players: 0, killed_by_players: 15}
                total:
                  last_day: {killed_players: 15, killed_by_players: 2}
                  last_week: {killed_players: 105, killed_by_players: 15}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Unknown world (the selector does not show the requested world), page without the Total row, or an invalid number in a row.
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: Kill Statistics data not found!}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/fansites:
    get:
      tags: [Community]
      operationId: getFansites
      summary: "Official Tibia fansites"
      description: |
        Reads the fansites promoted and supported by CipSoft, split as on the page: `promoted` and `supported`.
        Each fansite carries name, link, logo, contact character, the content types and the social media (the
        labels of the page icons; the social media carry no link), the language codes, the specials and the image
        of the fansite item, when there is one. The source URL takes no parameter from the client.

        The page changes rarely, so the API reads it once a day, at 10:10 Berlin time (after the server save),
        and when the service starts, and answers from memory. `updated_at` tells when the list was read. If the
        daily read fails, the last good list stays valid and a new attempt runs every 15 minutes.
        `Cache-Control` lasts until the next refresh.
      responses:
        '200':
          description: "Promoted and supported fansites."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fansites'
              example:
                count: 1
                updated_at: '2026-10-22T08:10:02Z'
                stale: false
                promoted:
                  - name: 'GuildStats.eu'
                    url: 'https://guildstats.eu/'
                    logo: 'https://static.tibia.com/images/community/fansitelogos/GuildStats.eu.gif'
                    contact: 'Sir Dzidek'
                    content: [Statistics, Texts, Tools]
                    social_media: []
                    languages: [en, es, nl, pl, pt]
                    specials: ['Stats for chars, guilds, worlds and bosses.', 'Calculators.']
                    item: 'https://static.tibia.com/images/community/fansiteitems/GuildStats.eu.gif'
                supported: []
        '404':
          description: "Page without the two tables, or without any valid fansite."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: {status_code: 404, message: 'Fansites data not found!'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Maintenance'
        '520':
          $ref: '#/components/responses/UpstreamFailed'
  /v2/community/guilds/{world}:
    get:
      tags: [Community]
      operationId: getGuilds
      summary: "Guilds of a world"
      description: |
        Reads the guild list of the world, split as on the page: `active` (active guilds) and `in_formation`
        (guilds in course of formation). Each guild carries `name`, `logo` and `description`, when the page has one.
        tibia.com matches the world case-sensitively and answers a wrong name with the bare selector; the world
        goes out with a capital first letter, and the page only counts when the selector shows that world as chosen.
      parameters:
        - $ref: '#/components/parameters/WorldPath'
      responses:
        '200':
          description: "Active and in-formation guilds of the world."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
