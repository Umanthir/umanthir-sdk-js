      operationId: getMaps
      summary: Maps and areas of the Tibia world
      description: |
        Without `region`, reads the page tree: each area carries `name`, `region` (the link slug),
        `location` (the page region, such as Main Continent) and `category` (the sub-region, such as Cities,
        when the page has one). `image` is the world map. The order is the page order.

        With `region`, opens the area page and `count` is 1. The item gains `image` (the area map) and
        `description` (the page paragraphs, separated by a blank line). tibia.com answers an unknown
        slug with the list itself, so the detail reads the list first: it validates the slug and gives
        `location` and `category`. That is why the detail makes two reads from tibia.com.
      parameters:
