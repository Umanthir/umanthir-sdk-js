      properties:
        name: {type: string}
        world: {type: string}
        paid_until: {type: string, format: date}
    GuildMember:
      type: object
      required: [rank, name, vocation, level, joined, online]
      properties:
        rank: {type: string, description: "Rank of the member. The page leaves the rank blank for whoever shares the rank above; here it repeats."}
        name: {type: string}
        title: {type: string, description: "Title of the member, without the parentheses."}
        vocation: {type: string}
        level: {type: integer}
        joined: {type: string, format: date}
        online: {type: boolean}
    GuildInvite:
      type: object
      required: [name, date]
      properties:
        name: {type: string}
        date: {type: string, format: date}
    GuildDetail:
      type: object
      required: [name, world, founded, status, status_text, applications_open, members_count, online_count, members, invited]
      properties:
        name: {type: string}
