          description: "Information sentences the parser does not recognise. Missing when there are none."
        members_count: {type: integer}
        online_count: {type: integer}
        members: {type: array, items: {$ref: '#/components/schemas/GuildMember'}}
        invited: {type: array, items: {$ref: '#/components/schemas/GuildInvite'}}
    ActivePoll:
      type: object
      required: [id, topic, ends_on]
