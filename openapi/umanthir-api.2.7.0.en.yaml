              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpellList'
              examples:
                lista:
                  summary: General list
                  value:
                    count: 2
                    updated_at: '2026-10-23T08:10:02Z'
                    stale: false
                    spells:
                      - name: Light Healing
                        spell: lighthealing
                        words: exura
                        group: Healing
                        type: Instant
                        level: 8
                        mana: 20
                        premium: false
                      - name: Avatar of Balance
                        spell: avatarofbalance
                        words: uteta res tio
                        group: Support
                        type: Instant
                        level: null
                        mana: 1200
                        premium: true
                animatedeadrune:
                  summary: Animate Dead Rune page
                  value:
                    count: 1
                    updated_at: '2026-10-23T08:10:02Z'
                    stale: false
                    spells:
                      - name: Animate Dead Rune
                        spell: animatedeadrune
                        words: adana mort
                        image: https://static.tibia.com/images/library/animatedeadrune.png
                        summary: This is a very scary spell.
                        group: Support
                        type: Rune
                        vocations: [Druid, Sorcerer]
                        cooldown: {seconds: 2, group_seconds: 2}
                        soul_points: 5
                        amount: 1
                        level: 27
                        mana: 600
                        premium: true
                        rune:
                          vocations: [Knight, Druid, Monk, Paladin, Sorcerer]
                          group: Support
                          level: 27
                          magic_level: 4
        '400':
