  /v2/wiki/houses/{slug}/floors/{z}:
    get:
      tags: [Wiki]
      operationId: getWikiHouseFloor
      summary: "Plan of one floor, as a transparent PNG"
      description: |
        The PNG of floor `{z}`, drawn as in the portal Editor, with a transparent background. Pixel (0, 0)
        is the `image_origin` square of the assembly JSON; each square is 32 px. To see a floor over the one
        below it, draw the lower one 32 px to the right and 32 px down. `ETag` is the sha256 of the published
        file. `Cache-Control` lasts 1 hour.
      parameters:
        - $ref: '#/components/parameters/HouseSlug'
        - name: z
          in: path
          required: true
          description: "Floor, 0 to 15, without a leading zero. Another value is 400 `Invalid floor.`; a floor the house does not have is 404 `Floor not found.`."
          schema: {type: integer, minimum: 0, maximum: 15, example: 7}
      responses:
        '200':
          description: "The floor plan."
          headers:
            X-API-Version:
              $ref: '#/components/headers/XApiVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            image/png:
              schema: {type: string, format: binary}
        '304':
          description: Not Modified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/HouseNotFound'
        '410':
          $ref: '#/components/responses/HouseGone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/HousesUnavailable'
  /v2/wiki/{category}:
    get:
      tags: [Wiki]
      operationId: getWikiItems
      summary: "Items of a category"
      description: |
        Basic data of every item of `{category}`, by name. Slugs come from `/v2/wiki/categories`; the
        wiki type behind each one stays in Portuguese in `type`, as on TibiaWiki BR. Fields without a value
        are left out. `wiki_url` and `image_url` are full links to TibiaWiki BR. `Cache-Control` lasts 5 minutes.
      parameters:
        - $ref: '#/components/parameters/WikiCategory'
      responses:
        '200':
          description: "The category and its items."
