      description: |
        Reads the achievements page. Each item carries `name`, `grade`, `points` and `description`,
        in page order: grade 1 to 4 and, within each grade, the table order.
        `points` is the range in the page legend for the grade ("Grade 1: 1-3 points"); a single value
        ("10 points") comes out with `min` equal to `max`. The page does not state the points of each achievement.

        `secret_count` is the number of secret achievements the page announces. Secret achievements have
        no name or description on the site and are not in the list. The source URL takes no parameter from the client.
      parameters:
        - name: grade
          in: query
          description: Keeps only this grade, from 1 to 4. Empty lists all of them. Any other value responds 400 `Invalid grade.`; a grade without achievements responds 200 with an empty list.
          schema:
            type: integer
            minimum: 1
            maximum: 4
            example: 2
