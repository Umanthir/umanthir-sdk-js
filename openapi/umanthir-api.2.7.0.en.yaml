      properties:
        experience: {type: integer, format: int64}
        level: {type: integer}
        exact_level: {type: number, format: double}
        level_experience: {type: integer, format: int64}
        next_level_experience: {type: integer, format: int64}
        to_next_level: {type: integer, format: int64}
        progress: {type: number, format: double, minimum: 0, maximum: 1}
