  /v2/wiki/{category}/{name}:
    get:
      tags: [Wiki]
      operationId: getWikiItem
      summary: "One item, with everything the wiki says"
      description: |
        One item of `{category}` by name, without case (`hellforged axe` works). Known fields of the
        infobox come with English names and types: hands as 1 or 2, `defense_mod`, `max_tier`,
        `imbuement_slots`, `classification`, `perks`, `dropped_by`, `vocations`, `skill_boosts`,
        `resistances`, `element_attack`, `npc_price`. Runes add `rune`. Every other field of the infobox
        stays in `attributes` with its original key, and so does a value the API cannot read. Texts stay in
        Portuguese, as on TibiaWiki BR. An item of another category is 404. `Cache-Control` lasts 5 minutes.
      parameters:
        - $ref: '#/components/parameters/WikiCategory'
        - name: name
          in: path
          required: true
          description: "Item name, without case. Over 200 characters is 400 `Invalid name.`."
          schema: {type: string, maxLength: 200, example: hellforged axe}
      responses:
        '200':
          description: "The item."
          headers:
            X-API-Version:
