        description: {type: string, description: "Description from the list, when the guild has one."}
    GuildList:
      type: object
      required: [world, count, active, in_formation]
      properties:
        world: {type: string}
        count: {type: integer, description: "Sum of active and in_formation."}
        active: {type: array, items: {$ref: '#/components/schemas/GuildSummary'}}
        in_formation: {type: array, items: {$ref: '#/components/schemas/GuildSummary'}}
    GuildDisband:
      type: object
