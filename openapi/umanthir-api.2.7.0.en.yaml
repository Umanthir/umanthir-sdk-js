      properties:
        level: {type: integer}
        share_experience:
          $ref: '#/components/schemas/Share'
    ShareExperience:
      type: object
      required: [levels, party]
      properties:
        levels: {type: array, items: {$ref: '#/components/schemas/ShareLevel'}}
        party:
          type: object
          description: "lowest and highest are the extremes of the party. shared_range is the overlap of every range and is left out when there is none. can_share is true when every level is inside shared_range."
          required: [lowest, highest, can_share]
          properties:
            lowest: {type: integer}
            highest: {type: integer}
            can_share: {type: boolean}
            shared_range:
              $ref: '#/components/schemas/Share'
    Regen:
