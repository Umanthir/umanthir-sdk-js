name: Release

# Publishes @umanthir/sdk when a signed version tag (vX.Y.Z or vX.Y.Z-pre.N) is pushed on main.
# npm publishing uses trusted publishing (OIDC): no npm token exists anywhere.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tag matches package.json and is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm ci --prefix tools/contract --ignore-scripts
      - run: npm run contract:check
      - run: npm run verify

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@umanthir/sdk/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: npm supports trusted publishing
        run: |
          set -eu
          v=$(npm --version)
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$v" \
            || { echo "::error::npm $v is older than 11.5.1"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack, SBOM and SRI
        id: artifacts
        run: |
          set -eu
          tarball=$(npm pack --json | node -p "JSON.parse(require('fs').readFileSync(0)).at(-1).filename")
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          sri="sha384-$(openssl dgst -sha384 -binary dist/umanthir.min.js | openssl base64 -A)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sri=$sri" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/umanthir.min.js
            dist/index.js
            dist/index.cjs
            ${{ steps.artifacts.outputs.tarball }}
      - name: Publish (trusted publishing, provenance)
        env:
          TARBALL: ${{ steps.artifacts.outputs.tarball }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -eu
          if [ "$PRERELEASE" = "true" ]; then tag=next; else tag=latest; fi
          npm publish "$TARBALL" --access public --tag "$tag"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SRI: ${{ steps.artifacts.outputs.sri }}
          TARBALL: ${{ steps.artifacts.outputs.tarball }}
        run: |
          set -eu
          node scripts/release-notes.mjs "$VERSION" "$SRI" > notes.md
          flags=""
          [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md $flags \
            dist/umanthir.min.js dist/umanthir.min.js.map sbom.cdx.json "$TARBALL"
